<script>
(function() {
  var btn = document.getElementById('goTopBtn');
  if (!btn) return;
  
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  });
  
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

<!-- 目录功能 JavaScript -->
<script>
(function() {
  function initToc() {
    var article = document.querySelector('.post-container');
    if (!article) return;
    
    var headers = article.querySelectorAll('h2, h3, h4, h5, h6');
    if (headers.length === 0) return;
    
    // 显示目录按钮（只有文章页面才显示）
    var mobileBtn = document.getElementById('tocMobileBtn');
    if (mobileBtn) {
      mobileBtn.classList.add('show');
    }
    
    // 创建手机端目录列表
    var mobileTocList = document.getElementById('tocMobileList');
    if (!mobileTocList) return;
    mobileTocList.innerHTML = '';
    
    headers.forEach(function(header, index) {
      var id = 'toc-' + index;
      header.id = id;
      
      // 手机端目录项
      var mobileLi = document.createElement('li');
      var mobileA = document.createElement('a');
      mobileA.href = '#' + id;
      mobileA.textContent = header.textContent;
      mobileA.className = 'toc-' + header.tagName.toLowerCase();
      mobileA.addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('tocMobilePanel').classList.remove('active');
      });
      mobileLi.appendChild(mobileA);
      mobileTocList.appendChild(mobileLi);
    });
    
    // 高亮当前章节
    var tocLinks = document.querySelectorAll('.toc-mobile-content a');
    window.addEventListener('scroll', function() {
      var scrollPos = window.scrollY + 100;
      var currentId = null;
      
      headers.forEach(function(header) {
        var offsetTop = header.offsetTop;
        if (offsetTop <= scrollPos) {
          currentId = header.id;
        }
      });
      
      tocLinks.forEach(function(link) {
        link.classList.remove('active');
        var href = link.getAttribute('href').substring(1);
        if (href === currentId) {
          link.classList.add('active');
        }
      });
    });
  }
  
  // 手机端目录按钮事件
  var mobileBtn = document.getElementById('tocMobileBtn');
  var mobilePanel = document.getElementById('tocMobilePanel');
  var mobileClose = document.getElementById('tocMobileClose');
  
  if (mobileBtn && mobilePanel) {
    mobileBtn.addEventListener('click', function() {
      mobilePanel.classList.add('active');
    });
  }
  
  if (mobileClose && mobilePanel) {
    mobileClose.addEventListener('click', function() {
      mobilePanel.classList.remove('active');
    });
  }
  
  if (mobilePanel) {
    mobilePanel.addEventListener('click', function(e) {
      if (e.target === mobilePanel) {
        mobilePanel.classList.remove('active');
      }
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initToc);
  } else {
    initToc();
  }
})();
</script>

<!-- 鼠标点击特效 - Canvas优化 -->
<canvas id="clickCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></canvas>
<script>
// Canvas点击特效 - 性能优化
(function() {
    var canvas = document.getElementById('clickCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var particles = [];
    var colors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff6600', '#0066ff', '#ff3366'];
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    
    function Particle(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = 5 + Math.random() * 10;
        var angle = Math.random() * Math.PI * 2;
        var speed = 2 + Math.random() * 3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = 0.008 + Math.random() * 0.01;
    }
    
    Particle.prototype.update = function() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        this.size *= 0.99;
    };
    
    Particle.prototype.draw = function() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };
    
    let animating = false;
    
    document.addEventListener('click', function(e) {
        var color = colors[Math.floor(Math.random() * colors.length)];
        for (var i = 0; i < 5; i++) {
            particles.push(new Particle(e.clientX, e.clientY, color));
        }
        // 如果没在动画，启动动画循环
        if (!animating) {
            animating = true;
            animate();
        }
    });
    
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            // 只有在粒子还可见的时候才绘制
            if (particles[i].alpha > 0 && particles[i].size > 0.5) {
                particles[i].draw();
            }
            // 完全消失后再移除
            if (particles[i].alpha <= 0 || particles[i].size <= 0.5) {
                particles.splice(i, 1);
            }
        }
        // 只有当还有粒子时才继续动画，否则停止
        if (particles.length > 0) {
            requestAnimationFrame(animate);
        } else {
            animating = false;
        }
    }
})();
</script>
