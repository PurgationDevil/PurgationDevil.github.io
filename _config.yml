# Site settings
title: PurgationDevil Blog
SEOTitle: we1c0me t0 PurgationDevil 810g
header-img: img/home-bg.jpg
description: "这里是 @PurgationDevil 的个人博客，与你一起发现更大的世界"
keyword: "PurgationDevil Blog, 博客, 个人网站, 互联网, Web, 逆向, C语言数据结构"
url: "https://PurgationDevil.github.io" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'

# Publish posts or collection documents with a future date.
future: false

# SNS settings
RSS: false
github_username: PurgationDevil
facebook_username: PurgationDevil
gitee_username: PurgationDevil
csdn_url: https://blog.csdn.net/2504_94717629

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: /:title/
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  math_engine: mathjax
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus settings
disqus_username: PurgationDevil

# Netease settings
netease_comment: false

# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics
ga_track_id: # Format: UA-xxxxxx-xx
ga_domain:

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "Web/逆向入门 | 努力学习呦~🥰"
sidebar-avatar: https://github.com/PurgationDevil.png # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: false # whether or not using Feature-Tags
featured-condition-size: 1 # A tag will be featured if the size of it is more than this condition value

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false

# 公告配置
announcement:
  enabled: true
  title: 📢 公告
  items:
    - "提升逆向基础"

# Friends
friends:
  [
  { title: "wnahom 的博客（算法）", href: "https://wnahom.github.io/" }
  ]
