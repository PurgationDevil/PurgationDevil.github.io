<!-- Simple Jekyll Search -->
<script src="{{ "/js/simple-jekyll-search.min.js" | prepend: site.baseurl }}"></script>
<script>
(function() {
    SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('search-results'),
        json: '/search.json',
        searchResultTemplate: '<div class="post-preview"><a href="{url}"><h2 class="post-title">{title}</h2><div class="post-meta">标签: {tags} | {date}</div></a></div>',
        noResultsText: '<div class="alert alert-warning">没有找到相关文章</div>'
    });
    
    var searchPage = document.querySelector('.search-page');
    var searchIcon = document.querySelector('.search-icon a');
    var searchClose = document.querySelector('.search-icon-close');
    var searchInput = document.getElementById('search-input');
    
    if (searchIcon) {
        searchIcon.addEventListener('click', function() {
            searchPage.classList.add('search-active');
            setTimeout(function() {
                searchInput.focus();
            }, 400);
        });
    }
    
    if (searchClose) {
        searchClose.addEventListener('click', function() {
            searchPage.classList.remove('search-active');
        });
    }
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && searchPage.classList.contains('search-active')) {
            searchPage.classList.remove('search-active');
        }
    });
})();
</script>

<!-- Service Worker -->
{% if site.service-worker %}
<script src="{{ "/js/sw-registration.js " | prepend: site.baseurl }}"></script>
{% endif %}
